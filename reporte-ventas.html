<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte Semanal de Ventas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0f14}
    input::placeholder{color:#4a4540}
    input:focus,select:focus{border-color:rgba(201,168,76,.5)!important;outline:none}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0d0f14}
    ::-webkit-scrollbar-thumb{background:#2a2520;border-radius:3px}
    @media(max-width:600px){table td:nth-child(1),table th:nth-child(1){display:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error-box{display:none;color:#d4775a;font-family:monospace;padding:40px;font-size:13px;background:#141720;margin:20px;border-radius:4px;border:1px solid rgba(212,119,90,.3)}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="error-box"></div>

  <script>
    window.onerror = function(msg, src, line) {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.innerHTML = 'ERROR: ' + msg + ' (linea ' + line + ')';
    };

    var firebaseConfig = {
      apiKey:            "AIzaSyCaTE8CruzVoXbuxiWw7780IHtuKNwC17Q",
      authDomain:        "cuenta-25c64.firebaseapp.com",
      projectId:         "cuenta-25c64",
      storageBucket:     "cuenta-25c64.firebasestorage.app",
      messagingSenderId: "728683182116",
      appId:             "1:728683182116:web:4cf969d1216c7f484f00b1"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    var ventasRef = db.collection("ventas");
    var gastosRef = db.collection("gastos");
    var semanasRef = db.collection("semanas_guardadas");
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DIAS = ["Lunes","Martes","Miercoles","Jueves","Viernes"];
    const DIAS_LABEL = { "Lunes":"Lunes","Martes":"Martes","Miercoles":"Miércoles","Jueves":"Jueves","Viernes":"Viernes" };

    const S = {
      input: {
        background:"#0d0f14", border:"1px solid rgba(255,255,255,.1)", borderRadius:"3px",
        padding:"10px 14px", color:"#e8e0d0", fontSize:"13px",
        fontFamily:"'Courier New',Courier,monospace", width:"100%",
      }
    };

    function fmt(n) {
      return (n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:0});
    }

    function getWeekRange() {
      const now = new Date();
      const mon = new Date(now);
      mon.setDate(now.getDate() - ((now.getDay()+6)%7));
      const sun = new Date(mon);
      sun.setDate(mon.getDate()+6);
      const f = d => d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
      return f(mon) + " - " + f(sun) + ", " + now.getFullYear();
    }

    function getWeekNum() {
      const now = new Date();
      const s = new Date(now.getFullYear(),0,1);
      return Math.ceil(((now-s)/86400000+s.getDay()+1)/7);
    }

    function App() {
      const [ventas,  setVentas]  = useState([]);
      const [loading, setLoading] = useState(true);
      const [fbError, setFbError] = useState(null);
      const [form,    setForm]    = useState({cliente:"",lugar:"",total:"",cajas:"",dia:"Lunes"});
      const [editId,  setEditId]  = useState(null);
      const [diaTab,  setDiaTab]  = useState("Todos");
      const [search,  setSearch]  = useState("");
      const [saved,   setSaved]   = useState(false);
      const [animIn,  setAnimIn]  = useState(false);
      const [gastos,  setGastos]  = useState([]);
      const [gForm,   setGForm]   = useState({concepto:"",monto:"",tipo:"Sueldo"});
      const [gEditId, setGEditId] = useState(null);
      const [gSaved,  setGSaved]  = useState(false);
      const [showGastos,  setShowGastos]  = useState(false);
      const [showResumen, setShowResumen] = useState(false);
      const [guardando,   setGuardando]   = useState(false);
      const [guardado,    setGuardado]    = useState(false);

      useEffect(() => {
        setTimeout(()=>setAnimIn(true),80);
        const unsub = ventasRef
          .orderBy("creadoEn","asc")
          .onSnapshot(
            snap => { setVentas(snap.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); },
            err  => { setFbError(err.message); setLoading(false); }
          );
        const unsubG = gastosRef
          .orderBy("creadoEn","asc")
          .onSnapshot(
            snap => setGastos(snap.docs.map(d=>({id:d.id,...d.data()}))),
            () => {}
          );
        return ()=>{ unsub(); unsubG(); };
      },[]);

      const porDia   = diaTab==="Todos" ? ventas : ventas.filter(v=>v.dia===diaTab);
      const filtered = porDia.filter(v=>
        (v.cliente||"").toLowerCase().includes(search.toLowerCase()) ||
        (v.lugar||"").toLowerCase().includes(search.toLowerCase())
      );

      const semTotal = ventas.reduce((s,v)=>s+(v.total||0),0);
      const semAvg   = ventas.length ? semTotal/ventas.length : 0;
      const semMax   = ventas.length ? Math.max(...ventas.map(v=>v.total||0)) : 0;
      const semCajas = ventas.reduce((s,v)=>s+(v.cajas||0),0);

      const totalGastos  = gastos.reduce((s,g)=>s+(g.monto||0),0);
      const totalSueldos = gastos.filter(g=>g.tipo==="Sueldo").reduce((s,g)=>s+(g.monto||0),0);
      const totalOtros   = gastos.filter(g=>g.tipo==="Gasto").reduce((s,g)=>s+(g.monto||0),0);
      const utilidadNeta = semTotal - totalGastos;

      const filtTotal = filtered.reduce((s,v)=>s+(v.total||0),0);
      const filtCajas = filtered.reduce((s,v)=>s+(v.cajas||0),0);

      const totPorDia = DIAS.map(d=>({
        dia: d,
        label: DIAS_LABEL[d],
        total: ventas.filter(v=>v.dia===d).reduce((s,v)=>s+(v.total||0),0)
      })).filter(d=>d.total>0);
      const dMax = totPorDia.length ? Math.max(...totPorDia.map(d=>d.total)) : 1;

      const porEstado = Object.values(ventas.reduce((acc,v)=>{
        const k=v.lugar||"Sin lugar";
        if(!acc[k]) acc[k]={lugar:k,total:0};
        acc[k].total+=v.total||0;
        return acc;
      },{}));
      const eMax = porEstado.length ? Math.max(...porEstado.map(e=>e.total)) : 1;

      const handleSubmit = async () => {
        if(!form.cliente||!form.lugar||!form.total) return;
        const data = {
          cliente: form.cliente.trim(),
          lugar:   form.lugar.trim(),
          total:   parseFloat(form.total)||0,
          cajas:   parseInt(form.cajas)||0,
          dia:     form.dia,
          creadoEn: editId
            ? (ventas.find(v=>v.id===editId)||{}).creadoEn
            : firebase.firestore.FieldValue.serverTimestamp(),
        };
        if(editId){ await ventasRef.doc(editId).update(data); setEditId(null); }
        else      { await ventasRef.add(data); }
        setForm({cliente:"",lugar:"",total:"",cajas:"",dia:"Lunes"});
        setSaved(true); setTimeout(()=>setSaved(false),1800);
      };

      const handleEdit = v => {
        setEditId(v.id);
        setForm({cliente:v.cliente,lugar:v.lugar,total:String(v.total),cajas:String(v.cajas||""),dia:v.dia||"Lunes"});
      };

      const handleDelete = async id => {
        if(window.confirm("Eliminar este registro?")) await ventasRef.doc(id).delete();
      };

      const handleGastoSubmit = async () => {
        if(!gForm.concepto||!gForm.monto) return;
        const data = {
          concepto: gForm.concepto.trim(),
          monto:    parseFloat(gForm.monto)||0,
          tipo:     gForm.tipo,
          creadoEn: gEditId
            ? (gastos.find(g=>g.id===gEditId)||{}).creadoEn
            : firebase.firestore.FieldValue.serverTimestamp(),
        };
        if(gEditId){ await gastosRef.doc(gEditId).update(data); setGEditId(null); }
        else       { await gastosRef.add(data); }
        setGForm({concepto:"",monto:"",tipo:"Sueldo"});
        setGSaved(true); setTimeout(()=>setGSaved(false),1800);
      };

      const handleGastoEdit = g => {
        setGEditId(g.id);
        setGForm({concepto:g.concepto,monto:String(g.monto),tipo:g.tipo||"Sueldo"});
      };

      const handleGastoDelete = async id => {
        if(window.confirm("Eliminar este gasto?")) await gastosRef.doc(id).delete();
      };

      const handleGuardarSemana = async () => {
        setGuardando(true);
        const semana = {
          semana:       getWeekNum(),
          rango:        getWeekRange(),
          ano:          new Date().getFullYear(),
          totalVentas:  semTotal,
          totalGastos:  totalGastos,
          totalSueldos: totalSueldos,
          totalOtros:   totalOtros,
          utilidadNeta: utilidadNeta,
          totalCajas:   semCajas,
          numClientes:  ventas.length,
          ventas:       ventas.map(v=>({cliente:v.cliente,lugar:v.lugar,total:v.total,cajas:v.cajas,dia:v.dia})),
          gastos:       gastos.map(g=>({concepto:g.concepto,monto:g.monto,tipo:g.tipo})),
          guardadoEn:   firebase.firestore.FieldValue.serverTimestamp(),
        };
        await semanasRef.add(semana);
        setGuardando(false);
        setGuardado(true);
        setTimeout(()=>setGuardado(false),2500);
      };

      const handleClearWeek = async () => {
        if(!window.confirm("Borrar TODOS los registros de la semana? Esta accion no se puede deshacer.")) return;
        const snap = await ventasRef.get();
        const batch = db.batch();
        snap.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
      };

      if(loading) return (
        <div style={{minHeight:"100vh",background:"#0d0f14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"16px"}}>
          <div style={{width:"32px",height:"32px",border:"3px solid rgba(201,168,76,.2)",borderTop:"3px solid #c9a84c",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
          <div style={{fontSize:"11px",letterSpacing:"4px",color:"#6a6358"}}>CONECTANDO...</div>
        </div>
      );

      if(fbError) return (
        <div style={{minHeight:"100vh",background:"#0d0f14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"12px",padding:"24px"}}>
          <div style={{fontSize:"11px",letterSpacing:"4px",color:"#d4775a"}}>ERROR DE CONEXION</div>
          <div style={{fontSize:"12px",color:"#6a6358",maxWidth:"400px",textAlign:"center"}}>{fbError}</div>
          <div style={{fontSize:"11px",color:"#4a4540"}}>Verifica que las reglas de Firestore esten en modo de prueba.</div>
        </div>
      );

      return (
        <div style={{minHeight:"100vh",background:"#0d0f14",fontFamily:"'Courier New',Courier,monospace",color:"#e8e0d0"}}>

          {/* HEADER */}
          <div style={{background:"linear-gradient(135deg,#1a1f2e,#0d1117)",borderBottom:"2px solid #c9a84c",padding:"28px 32px 20px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(201,168,76,.06) 39px,rgba(201,168,76,.06) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(201,168,76,.06) 39px,rgba(201,168,76,.06) 40px)",pointerEvents:"none"}}/>
            <div style={{position:"relative",zIndex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
                <span style={{fontSize:"10px",letterSpacing:"5px",color:"#c9a84c",textTransform:"uppercase"}}>Reporte Semanal</span>
                <span style={{width:"7px",height:"7px",borderRadius:"50%",background:"#7eb8a0",boxShadow:"0 0 5px #7eb8a0",display:"inline-block"}}/>
              </div>
              <h1 style={{fontSize:"clamp(26px,5vw,48px)",fontWeight:"bold",color:"#f5ead0",letterSpacing:"-1px",lineHeight:1}}>VENTAS</h1>
              <div style={{display:"flex",alignItems:"center",gap:"14px",marginTop:"8px",flexWrap:"wrap"}}>
                <span style={{fontSize:"12px",color:"#8a7d65",letterSpacing:"1px"}}>{getWeekRange()}</span>
                <button onClick={handleGuardarSemana} disabled={guardando} style={{background:"rgba(126,184,160,.12)",color:"#7eb8a0",border:"1px solid rgba(126,184,160,.35)",padding:"4px 12px",borderRadius:"2px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer"}}>
                  {guardando ? "GUARDANDO..." : guardado ? "GUARDADO ✓" : "GUARDAR SEMANA"}
                </button>
                <button onClick={handleClearWeek} style={{background:"rgba(212,119,90,.12)",color:"#d4775a",border:"1px solid rgba(212,119,90,.35)",padding:"4px 12px",borderRadius:"2px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer"}}>
                  BORRAR SEMANA
                </button>
              </div>
            </div>

            {/* TABS DIAS */}
            <div style={{display:"flex",gap:"5px",marginTop:"16px",flexWrap:"wrap"}}>
              {["Todos",...DIAS].map(d=>{
                const activo = diaTab===d;
                const lbl = d==="Todos"?"Todos":DIAS_LABEL[d].slice(0,3);
                return (
                  <button key={d} onClick={()=>setDiaTab(d)} style={{
                    padding:"5px 13px",borderRadius:"2px",fontSize:"10px",letterSpacing:"2px",
                    background: activo?"#c9a84c":"rgba(255,255,255,.04)",
                    color:      activo?"#0d0f14":"#6a6358",
                    border:     activo?"none":"1px solid rgba(255,255,255,.07)",
                    cursor:"pointer",fontFamily:"inherit",fontWeight:activo?"bold":"normal",
                  }}>{lbl}</button>
                );
              })}
            </div>
          </div>

          <div style={{maxWidth:"1100px",margin:"0 auto",padding:"28px 20px"}}>

            {/* KPI CARDS */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:"14px",marginBottom:"30px",opacity:animIn?1:0,transform:animIn?"none":"translateY(16px)",transition:"all .6s ease"}}>
              {[
                {label:"Total Semana",       value:fmt(semTotal), accent:"#c9a84c"},
                {label:"Promedio Venta",     value:fmt(semAvg),   accent:"#7eb8a0"},
                {label:"Venta Mas Alta",     value:fmt(semMax),   accent:"#d4775a"},
                {label:"Clientes",           value:ventas.length, accent:"#8fa8d4"},
                {label:"Total Cajas",        value:semCajas+" cajas", accent:"#b07fd4"},
              ].map(k=>(
                <div key={k.label} style={{background:"#141720",border:"1px solid rgba(255,255,255,.06)",borderTop:"3px solid "+k.accent,borderRadius:"4px",padding:"18px 20px"}}>
                  <div style={{fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase",marginBottom:"8px"}}>{k.label}</div>
                  <div style={{fontSize:"20px",fontWeight:"bold",color:k.accent}}>{k.value}</div>
                </div>
              ))}
            </div>

            {/* GRAFICA POR DIA */}
            <div style={{background:"#141720",border:"1px solid rgba(255,255,255,.06)",borderRadius:"4px",padding:"22px",marginBottom:"24px",opacity:animIn?1:0,transition:"all .7s ease .1s"}}>
              <div style={{fontSize:"9px",letterSpacing:"4px",color:"#6a6358",textTransform:"uppercase",marginBottom:"18px"}}>QUE DIA SE VENDIO MAS</div>
              {totPorDia.length===0
                ? <div style={{color:"#4a4540",fontSize:"12px",letterSpacing:"2px"}}>Sin datos aun</div>
                : totPorDia.map(d=>(
                  <div key={d.dia} style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"10px"}}>
                    <div style={{width:"80px",fontSize:"11px",color:"#a09080",textAlign:"right",flexShrink:0}}>{d.label}</div>
                    <div style={{flex:1,height:"20px",background:"rgba(255,255,255,.04)",borderRadius:"2px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:((d.total/dMax)*100)+"%",background:"linear-gradient(90deg,#c9a84c,#e8c96a)",borderRadius:"2px",transition:"width 1s cubic-bezier(.22,1,.36,1)"}}/>
                    </div>
                    <div style={{width:"80px",fontSize:"11px",color:"#c9a84c",textAlign:"right",flexShrink:0}}>{fmt(d.total)}</div>
                  </div>
                ))
              }
            </div>

            {/* GRAFICA POR ESTADO */}
            <div style={{background:"#141720",border:"1px solid rgba(255,255,255,.06)",borderRadius:"4px",padding:"22px",marginBottom:"24px",opacity:animIn?1:0,transition:"all .7s ease .18s"}}>
              <div style={{fontSize:"9px",letterSpacing:"4px",color:"#6a6358",textTransform:"uppercase",marginBottom:"18px"}}>QUE ESTADO VENDIO MAS</div>
              {porEstado.length===0
                ? <div style={{color:"#4a4540",fontSize:"12px",letterSpacing:"2px"}}>Sin datos aun</div>
                : porEstado.map(e=>(
                  <div key={e.lugar} style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"10px"}}>
                    <div style={{width:"120px",fontSize:"11px",color:"#a09080",textAlign:"right",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.lugar}</div>
                    <div style={{flex:1,height:"20px",background:"rgba(255,255,255,.04)",borderRadius:"2px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:((e.total/eMax)*100)+"%",background:"linear-gradient(90deg,#8fa8d4,#b0c8f0)",borderRadius:"2px",transition:"width 1s cubic-bezier(.22,1,.36,1)"}}/>
                    </div>
                    <div style={{width:"80px",fontSize:"11px",color:"#8fa8d4",textAlign:"right",flexShrink:0}}>{fmt(e.total)}</div>
                  </div>
                ))
              }
            </div>

            {/* FORMULARIO */}
            <div style={{background:"#141720",border:"1px solid rgba(201,168,76,.22)",borderRadius:"4px",padding:"22px",marginBottom:"24px",opacity:animIn?1:0,transition:"all .7s ease .24s"}}>
              <div style={{fontSize:"9px",letterSpacing:"4px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"16px"}}>
                {editId ? "EDITAR VENTA" : "+ NUEVA VENTA"}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:"12px",marginBottom:"14px"}}>
                <input placeholder="Nombre del cliente" value={form.cliente}
                  onChange={e=>setForm(f=>({...f,cliente:e.target.value}))} style={S.input}/>
                <input placeholder="Lugar del cliente" value={form.lugar}
                  onChange={e=>setForm(f=>({...f,lugar:e.target.value}))} style={S.input}/>
                <input placeholder="Total ($)" type="number" value={form.total}
                  onChange={e=>setForm(f=>({...f,total:e.target.value}))} style={S.input}/>
                <input placeholder="Cajas enviadas" type="number" value={form.cajas}
                  onChange={e=>setForm(f=>({...f,cajas:e.target.value}))} style={S.input}/>
                <select value={form.dia} onChange={e=>setForm(f=>({...f,dia:e.target.value}))}
                  style={{...S.input,cursor:"pointer",appearance:"none"}}>
                  {DIAS.map(d=><option key={d} value={d}>{DIAS_LABEL[d]}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
                <button onClick={handleSubmit} style={{background:"#c9a84c",color:"#0d0f14",border:"none",padding:"10px 22px",borderRadius:"3px",fontFamily:"inherit",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",cursor:"pointer",fontWeight:"bold"}}>
                  {editId?"GUARDAR":"AGREGAR"}
                </button>
                {editId && (
                  <button onClick={()=>{setEditId(null);setForm({cliente:"",lugar:"",total:"",cajas:"",dia:"Lunes"});}}
                    style={{background:"transparent",color:"#6a6358",border:"1px solid rgba(255,255,255,.1)",padding:"10px 16px",borderRadius:"3px",fontFamily:"inherit",fontSize:"11px",letterSpacing:"2px",cursor:"pointer"}}>
                    CANCELAR
                  </button>
                )}
                {saved && <span style={{fontSize:"11px",color:"#7eb8a0",letterSpacing:"2px"}}>GUARDADO</span>}
              </div>
            </div>

            {/* BUSCADOR */}
            <div style={{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap",marginBottom:"14px"}}>
              <input placeholder="Buscar cliente o lugar..." value={search}
                onChange={e=>setSearch(e.target.value)}
                style={{...S.input,maxWidth:"300px"}}/>
              {diaTab!=="Todos" && (
                <span style={{fontSize:"10px",letterSpacing:"2px",color:"#c9a84c",padding:"5px 12px",border:"1px solid rgba(201,168,76,.25)",borderRadius:"2px"}}>
                  {DIAS_LABEL[diaTab]} — {filtered.length} reg.
                </span>
              )}
            </div>

            {/* TABLA */}
            <div style={{background:"#141720",border:"1px solid rgba(255,255,255,.06)",borderRadius:"4px",overflow:"auto",opacity:animIn?1:0,transition:"all .7s ease .32s"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:"520px"}}>
                <thead>
                  <tr style={{borderBottom:"2px solid rgba(201,168,76,.28)"}}>
                    {["#","Dia","Cliente","Lugar","Cajas","Total",""].map((h,i)=>(
                      <th key={i} style={{padding:"13px 16px",textAlign:(h==="Total"||h==="Cajas")?"right":"left",fontSize:"9px",letterSpacing:"4px",textTransform:"uppercase",color:"#6a6358",fontWeight:"normal"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((v,i)=>(
                    <tr key={v.id}
                      style={{borderBottom:"1px solid rgba(255,255,255,.04)",background:i%2===0?"transparent":"rgba(255,255,255,.014)",transition:"background .2s"}}
                      onMouseEnter={e=>e.currentTarget.style.background="rgba(201,168,76,.055)"}
                      onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":"rgba(255,255,255,.014)"}
                    >
                      <td style={{padding:"13px 16px",fontSize:"11px",color:"#4a4540",width:"36px"}}>{String(i+1).padStart(2,"0")}</td>
                      <td style={{padding:"13px 16px",fontSize:"10px",whiteSpace:"nowrap"}}>
                        <span style={{background:"rgba(201,168,76,.11)",color:"#c9a84c",padding:"3px 7px",borderRadius:"2px"}}>{DIAS_LABEL[v.dia]||v.dia||"—"}</span>
                      </td>
                      <td style={{padding:"13px 16px",fontSize:"13px",color:"#e8e0d0"}}>{v.cliente}</td>
                      <td style={{padding:"13px 16px",fontSize:"12px",color:"#8a7d65"}}>📍 {v.lugar}</td>
                      <td style={{padding:"13px 16px",fontSize:"12px",color:"#8fa8d4",textAlign:"right"}}>{v.cajas||0} 📦</td>
                      <td style={{padding:"13px 16px",fontSize:"14px",color:"#c9a84c",textAlign:"right",fontWeight:"bold"}}>{fmt(v.total)}</td>
                      <td style={{padding:"13px 16px",textAlign:"right",whiteSpace:"nowrap"}}>
                        <button onClick={()=>handleEdit(v)} style={{background:"none",border:"none",color:"#7eb8a0",cursor:"pointer",fontSize:"15px",marginRight:"6px",padding:"2px 5px"}}>✎</button>
                        <button onClick={()=>handleDelete(v.id)} style={{background:"none",border:"none",color:"#d4775a",cursor:"pointer",fontSize:"15px",padding:"2px 5px"}}>✕</button>
                      </td>
                    </tr>
                  ))}
                  {filtered.length===0 && (
                    <tr><td colSpan={7} style={{padding:"40px",textAlign:"center",color:"#4a4540",fontSize:"12px",letterSpacing:"2px"}}>SIN REGISTROS</td></tr>
                  )}
                </tbody>
                <tfoot>
                  <tr style={{borderTop:"2px solid rgba(201,168,76,.28)"}}>
                    <td colSpan={4} style={{padding:"13px 16px",fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase"}}>
                      {diaTab==="Todos"?"Total Semana":"Total "+DIAS_LABEL[diaTab]}
                    </td>
                    <td style={{padding:"13px 16px",textAlign:"right",fontSize:"12px",color:"#8fa8d4"}}>{filtCajas} 📦</td>
                    <td style={{padding:"13px 16px",textAlign:"right",fontSize:"15px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(filtTotal)}</td>
                    <td/>
                  </tr>
                </tfoot>
              </table>
            </div>


            {/* GASTOS SECTION */}
            <div style={{marginTop:"32px",opacity:animIn?1:0,transition:"all .7s ease .4s"}}>

              {/* Toggle button */}
              <button onClick={()=>setShowGastos(v=>!v)} style={{
                display:"flex",alignItems:"center",gap:"10px",width:"100%",
                background:"#141720",border:"1px solid rgba(212,119,90,.3)",
                borderRadius:"4px",padding:"16px 20px",cursor:"pointer",
                fontFamily:"inherit",color:"#d4775a",textAlign:"left",
                justifyContent:"space-between"
              }}>
                <span style={{fontSize:"10px",letterSpacing:"4px",textTransform:"uppercase"}}>
                  — GASTOS SEMANALES
                </span>
                <span style={{fontSize:"18px",color:"#d4775a",lineHeight:1}}>{showGastos?"▲":"▼"}</span>
              </button>

              {showGastos && (
                <div style={{background:"#141720",border:"1px solid rgba(212,119,90,.2)",borderTop:"none",borderRadius:"0 0 4px 4px",padding:"24px"}}>

                  {/* Resumen gastos */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:"12px",marginBottom:"24px"}}>
                    {[
                      {label:"Sueldos",    value:fmt(totalSueldos), accent:"#d4775a"},
                      {label:"Otros Gastos",value:fmt(totalOtros),  accent:"#e8956a"},
                      {label:"Total Gastos",value:fmt(totalGastos), accent:"#d4775a"},
                      {label:"Utilidad Neta",value:fmt(utilidadNeta),accent:utilidadNeta>=0?"#7eb8a0":"#d4775a"},
                    ].map(k=>(
                      <div key={k.label} style={{background:"#0d0f14",border:"1px solid rgba(255,255,255,.06)",borderTop:"2px solid "+k.accent,borderRadius:"4px",padding:"14px 16px"}}>
                        <div style={{fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase",marginBottom:"6px"}}>{k.label}</div>
                        <div style={{fontSize:"18px",fontWeight:"bold",color:k.accent}}>{k.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* Barra ventas vs gastos */}
                  <div style={{marginBottom:"24px"}}>
                    <div style={{fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase",marginBottom:"12px"}}>Ventas vs Gastos</div>
                    <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                        <div style={{width:"70px",fontSize:"10px",color:"#c9a84c",textAlign:"right",flexShrink:0}}>Ventas</div>
                        <div style={{flex:1,height:"18px",background:"rgba(255,255,255,.04)",borderRadius:"2px",overflow:"hidden"}}>
                          <div style={{height:"100%",width:"100%",background:"linear-gradient(90deg,#c9a84c,#e8c96a)",borderRadius:"2px"}}/>
                        </div>
                        <div style={{width:"80px",fontSize:"10px",color:"#c9a84c",textAlign:"right",flexShrink:0}}>{fmt(semTotal)}</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                        <div style={{width:"70px",fontSize:"10px",color:"#d4775a",textAlign:"right",flexShrink:0}}>Gastos</div>
                        <div style={{flex:1,height:"18px",background:"rgba(255,255,255,.04)",borderRadius:"2px",overflow:"hidden"}}>
                          <div style={{height:"100%",width:(semTotal>0?Math.min((totalGastos/semTotal)*100,100):0)+"%",background:"linear-gradient(90deg,#d4775a,#e8956a)",borderRadius:"2px",transition:"width 1s ease"}}/>
                        </div>
                        <div style={{width:"80px",fontSize:"10px",color:"#d4775a",textAlign:"right",flexShrink:0}}>{fmt(totalGastos)}</div>
                      </div>
                    </div>
                  </div>

                  {/* Form nuevo gasto */}
                  <div style={{background:"#0d0f14",border:"1px solid rgba(212,119,90,.2)",borderRadius:"4px",padding:"18px",marginBottom:"20px"}}>
                    <div style={{fontSize:"9px",letterSpacing:"4px",color:"#d4775a",textTransform:"uppercase",marginBottom:"14px"}}>
                      {gEditId ? "EDITAR GASTO" : "+ NUEVO GASTO"}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:"10px",marginBottom:"12px"}}>
                      <input placeholder="Concepto (ej: Sueldo Juan)" value={gForm.concepto}
                        onChange={e=>setGForm(f=>({...f,concepto:e.target.value}))} style={S.input}/>
                      <input placeholder="Monto ($)" type="number" value={gForm.monto}
                        onChange={e=>setGForm(f=>({...f,monto:e.target.value}))} style={S.input}/>
                      <select value={gForm.tipo} onChange={e=>setGForm(f=>({...f,tipo:e.target.value}))}
                        style={{...S.input,cursor:"pointer",appearance:"none"}}>
                        <option value="Sueldo">Sueldo</option>
                        <option value="Gasto">Gasto</option>
                      </select>
                    </div>
                    <div style={{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
                      <button onClick={handleGastoSubmit} style={{background:"#d4775a",color:"#fff",border:"none",padding:"9px 22px",borderRadius:"3px",fontFamily:"inherit",fontSize:"10px",letterSpacing:"2px",textTransform:"uppercase",cursor:"pointer",fontWeight:"bold"}}>
                        {gEditId?"GUARDAR":"AGREGAR"}
                      </button>
                      {gEditId && (
                        <button onClick={()=>{setGEditId(null);setGForm({concepto:"",monto:"",tipo:"Sueldo"});}}
                          style={{background:"transparent",color:"#6a6358",border:"1px solid rgba(255,255,255,.1)",padding:"9px 16px",borderRadius:"3px",fontFamily:"inherit",fontSize:"10px",letterSpacing:"2px",cursor:"pointer"}}>
                          CANCELAR
                        </button>
                      )}
                      {gSaved && <span style={{fontSize:"10px",color:"#7eb8a0",letterSpacing:"2px"}}>GUARDADO</span>}
                    </div>
                  </div>

                  {/* Tabla gastos */}
                  <div style={{overflow:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:"400px"}}>
                      <thead>
                        <tr style={{borderBottom:"2px solid rgba(212,119,90,.25)"}}>
                          {["#","Concepto","Tipo","Monto",""].map((h,i)=>(
                            <th key={i} style={{padding:"12px 14px",textAlign:h==="Monto"?"right":"left",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",color:"#6a6358",fontWeight:"normal"}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {gastos.length===0 && (
                          <tr><td colSpan={5} style={{padding:"30px",textAlign:"center",color:"#4a4540",fontSize:"11px",letterSpacing:"2px"}}>SIN GASTOS REGISTRADOS</td></tr>
                        )}
                        {gastos.map((g,i)=>(
                          <tr key={g.id}
                            style={{borderBottom:"1px solid rgba(255,255,255,.04)",background:i%2===0?"transparent":"rgba(255,255,255,.014)",transition:"background .2s"}}
                            onMouseEnter={e=>e.currentTarget.style.background="rgba(212,119,90,.05)"}
                            onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":"rgba(255,255,255,.014)"}
                          >
                            <td style={{padding:"12px 14px",fontSize:"11px",color:"#4a4540",width:"36px"}}>{String(i+1).padStart(2,"0")}</td>
                            <td style={{padding:"12px 14px",fontSize:"13px",color:"#e8e0d0"}}>{g.concepto}</td>
                            <td style={{padding:"12px 14px"}}>
                              <span style={{
                                background: g.tipo==="Sueldo"?"rgba(212,119,90,.15)":"rgba(232,149,106,.12)",
                                color:      g.tipo==="Sueldo"?"#d4775a":"#e8956a",
                                padding:"3px 8px",borderRadius:"2px",fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase"
                              }}>{g.tipo}</span>
                            </td>
                            <td style={{padding:"12px 14px",fontSize:"14px",color:"#d4775a",textAlign:"right",fontWeight:"bold"}}>{fmt(g.monto)}</td>
                            <td style={{padding:"12px 14px",textAlign:"right",whiteSpace:"nowrap"}}>
                              <button onClick={()=>handleGastoEdit(g)} style={{background:"none",border:"none",color:"#7eb8a0",cursor:"pointer",fontSize:"15px",marginRight:"6px",padding:"2px 5px"}}>✎</button>
                              <button onClick={()=>handleGastoDelete(g.id)} style={{background:"none",border:"none",color:"#d4775a",cursor:"pointer",fontSize:"15px",padding:"2px 5px"}}>✕</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                      <tfoot>
                        <tr style={{borderTop:"2px solid rgba(212,119,90,.25)"}}>
                          <td colSpan={3} style={{padding:"12px 14px",fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase"}}>Total Gastos</td>
                          <td style={{padding:"12px 14px",textAlign:"right",fontSize:"15px",color:"#d4775a",fontWeight:"bold"}}>{fmt(totalGastos)}</td>
                          <td/>
                        </tr>
                        <tr>
                          <td colSpan={3} style={{padding:"12px 14px",fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase"}}>Utilidad Neta</td>
                          <td style={{padding:"12px 14px",textAlign:"right",fontSize:"16px",fontWeight:"bold",color:utilidadNeta>=0?"#7eb8a0":"#d4775a"}}>{fmt(utilidadNeta)}</td>
                          <td/>
                        </tr>
                      </tfoot>
                    </table>
                  </div>

                </div>
              )}
            </div>

            {/* BOTON RESUMEN FINAL */}
            <div style={{marginTop:"28px",textAlign:"center"}}>
              <button onClick={()=>setShowResumen(true)} style={{
                background:"linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.08))",
                color:"#c9a84c",border:"1px solid rgba(201,168,76,.4)",
                padding:"14px 40px",borderRadius:"3px",fontFamily:"inherit",
                fontSize:"10px",letterSpacing:"4px",textTransform:"uppercase",
                cursor:"pointer",transition:"all .3s",width:"100%",maxWidth:"360px"
              }}>
                VER RESUMEN FINAL DE LA SEMANA
              </button>
            </div>

            <div style={{marginTop:"22px",fontSize:"9px",letterSpacing:"2px",color:"#2a2520",textAlign:"center"}}>
              SEMANA {getWeekNum()} &middot; {new Date().getFullYear()}
            </div>

            {/* MODAL RESUMEN */}
            {showResumen && (
              <div onClick={()=>setShowResumen(false)} style={{
                position:"fixed",inset:0,background:"rgba(0,0,0,.75)",
                zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",
                padding:"20px",backdropFilter:"blur(4px)"
              }}>
                <div onClick={e=>e.stopPropagation()} style={{
                  background:"#141720",border:"1px solid rgba(201,168,76,.25)",
                  borderRadius:"6px",width:"100%",maxWidth:"480px",overflow:"hidden",
                  maxHeight:"90vh",overflowY:"auto"
                }}>
                  {/* Header */}
                  <div style={{background:"linear-gradient(135deg,#1a1f2e,#0d1117)",borderBottom:"1px solid rgba(201,168,76,.2)",padding:"20px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:"9px",letterSpacing:"5px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"4px"}}>Resumen Final</div>
                      <div style={{fontSize:"14px",color:"#f5ead0",fontWeight:"bold",letterSpacing:"1px"}}>SEMANA {getWeekNum()} &middot; {new Date().getFullYear()}</div>
                      <div style={{fontSize:"11px",color:"#6a6358",marginTop:"2px"}}>{getWeekRange()}</div>
                    </div>
                    <button onClick={()=>setShowResumen(false)} style={{background:"none",border:"none",color:"#6a6358",cursor:"pointer",fontSize:"20px",padding:"4px"}}>✕</button>
                  </div>

                  <div style={{padding:"24px"}}>

                    {/* VENTAS */}
                    <div style={{marginBottom:"20px"}}>
                      <div style={{fontSize:"9px",letterSpacing:"4px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"12px",paddingBottom:"8px",borderBottom:"1px solid rgba(201,168,76,.15)"}}>
                        VENTAS
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                        {ventas.reduce((acc,v)=>{
                          const k=v.lugar||"Sin lugar";
                          if(!acc[k]) acc[k]={lugar:k,total:0,cajas:0,count:0};
                          acc[k].total+=v.total||0; acc[k].cajas+=v.cajas||0; acc[k].count++;
                          return acc;
                        }, {}) && Object.values(ventas.reduce((acc,v)=>{
                          const k=v.lugar||"Sin lugar";
                          if(!acc[k]) acc[k]={lugar:k,total:0,cajas:0,count:0};
                          acc[k].total+=v.total||0; acc[k].cajas+=v.cajas||0; acc[k].count++;
                          return acc;
                        },{})).map((e,i)=>(
                          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"rgba(201,168,76,.05)",borderRadius:"3px"}}>
                            <span style={{fontSize:"12px",color:"#e8e0d0"}}>📍 {e.lugar}</span>
                            <div style={{textAlign:"right"}}>
                              <div style={{fontSize:"14px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(e.total)}</div>
                              <div style={{fontSize:"9px",color:"#6a6358"}}>{e.cajas} cajas · {e.count} cliente{e.count!==1?"s":""}</div>
                            </div>
                          </div>
                        ))}
                        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 12px",borderTop:"1px solid rgba(201,168,76,.2)",marginTop:"4px"}}>
                          <span style={{fontSize:"10px",letterSpacing:"2px",color:"#c9a84c",textTransform:"uppercase",fontWeight:"bold"}}>Total Ventas</span>
                          <span style={{fontSize:"18px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(semTotal)}</span>
                        </div>
                      </div>
                    </div>

                    {/* GASTOS */}
                    <div style={{marginBottom:"20px"}}>
                      <div style={{fontSize:"9px",letterSpacing:"4px",color:"#d4775a",textTransform:"uppercase",marginBottom:"12px",paddingBottom:"8px",borderBottom:"1px solid rgba(212,119,90,.15)"}}>
                        GASTOS
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                        {gastos.length===0 && <div style={{fontSize:"11px",color:"#4a4540",letterSpacing:"2px",textAlign:"center",padding:"12px"}}>Sin gastos registrados</div>}
                        {gastos.map((g,i)=>(
                          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"rgba(212,119,90,.05)",borderRadius:"3px"}}>
                            <div>
                              <span style={{fontSize:"12px",color:"#e8e0d0"}}>{g.concepto}</span>
                              <span style={{marginLeft:"8px",background:"rgba(212,119,90,.15)",color:"#d4775a",padding:"2px 6px",borderRadius:"2px",fontSize:"8px",letterSpacing:"2px",textTransform:"uppercase"}}>{g.tipo}</span>
                            </div>
                            <span style={{fontSize:"14px",color:"#d4775a",fontWeight:"bold"}}>{fmt(g.monto)}</span>
                          </div>
                        ))}
                        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 12px",borderTop:"1px solid rgba(212,119,90,.2)",marginTop:"4px"}}>
                          <span style={{fontSize:"10px",letterSpacing:"2px",color:"#d4775a",textTransform:"uppercase",fontWeight:"bold"}}>Total Gastos</span>
                          <span style={{fontSize:"18px",color:"#d4775a",fontWeight:"bold"}}>{fmt(totalGastos)}</span>
                        </div>
                      </div>
                    </div>

                    {/* RESULTADO FINAL */}
                    <div style={{background:utilidadNeta>=0?"rgba(126,184,160,.08)":"rgba(212,119,90,.08)",border:"1px solid "+(utilidadNeta>=0?"rgba(126,184,160,.3)":"rgba(212,119,90,.3)"),borderRadius:"4px",padding:"20px"}}>
                      <div style={{fontSize:"9px",letterSpacing:"4px",color:utilidadNeta>=0?"#7eb8a0":"#d4775a",textTransform:"uppercase",marginBottom:"16px",textAlign:"center"}}>
                        RESULTADO FINAL
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                        <div style={{display:"flex",justifyContent:"space-between"}}>
                          <span style={{fontSize:"12px",color:"#8a7d65"}}>Total Ventas</span>
                          <span style={{fontSize:"14px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(semTotal)}</span>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between"}}>
                          <span style={{fontSize:"12px",color:"#8a7d65"}}>Total Gastos</span>
                          <span style={{fontSize:"14px",color:"#d4775a",fontWeight:"bold"}}>- {fmt(totalGastos)}</span>
                        </div>
                        <div style={{height:"1px",background:utilidadNeta>=0?"rgba(126,184,160,.3)":"rgba(212,119,90,.3)"}}/>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                          <span style={{fontSize:"13px",letterSpacing:"2px",textTransform:"uppercase",color:utilidadNeta>=0?"#7eb8a0":"#d4775a"}}>Utilidad Neta</span>
                          <span style={{fontSize:"26px",fontWeight:"bold",color:utilidadNeta>=0?"#7eb8a0":"#d4775a"}}>{fmt(utilidadNeta)}</span>
                        </div>
                      </div>
                    </div>

                    <button onClick={()=>setShowResumen(false)} style={{width:"100%",marginTop:"20px",background:"transparent",border:"1px solid rgba(255,255,255,.1)",color:"#6a6358",padding:"12px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer",borderRadius:"3px"}}>
                      CERRAR
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
