<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

</style>

  var firebaseConfig = {
    apiKey:"AIzaSyCaTE8CruzVoXbuxiWw7780IHtuKNwC17Q",
    authDomain:"cuenta-25c64.firebaseapp.com",
    projectId:"cuenta-25c64",
    storageBucket:"cuenta-25c64.firebasestorage.app",
    messagingSenderId:"728683182116",

  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var ventasRef   = db.collection("ventas");

<script type="text/babel">
const {useState,useEffect} = React;

const DIAS = ["Lunes","Martes","Miercoles","Jueves","Viernes","Semanas"];
const DL   = {Lunes:"Lunes",Martes:"Martes",Miercoles:"Miercoles",Jueves:"Jueves",Viernes:"Viernes",Semanas:"Semanas"};
// Tabs: dias + Gastos + Historial
const TABS = ["Todos","Lunes","Martes","Miercoles","Jueves","Viernes","Semanas","Gastos","Historial"];
const TAB_LBL = {Todos:"Todos",Lunes:"Lun",Martes:"Mar",Miercoles:"Mie",Jueves:"Jue",Viernes:"Vie",Semanas:"Semanas",Gastos:"Gastos",Historial:"Historial"};

const SI = {background:"#0d0f14",border:"1px solid rgba(255,255,255,.1)",borderRadius:"3px",padding:"10px 14px",color:"#e8e0d0",fontSize:"13px",fontFamily:"Courier New,monospace",width:"100%"};

function fmt(n){return (n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:0});}

function descargarPDF({ventas,gastos,semTotal,semAvg,semMax,semCajas,totGastos,totSueldos,totOtros,utilidad,porDia,porEst,modo}){
  const soloSemanas = modo==="semanas";
  if(soloSemanas){
    // Modo Semanas: solo ventas con dia="Semanas", sin gastos
    ventas = ventas.filter(v=>v.dia==="Semanas");
    gastos = [];
    semTotal = ventas.reduce((s,v)=>s+(v.total||0),0);
    semAvg   = ventas.length?semTotal/ventas.length:0;
    semMax   = ventas.length?Math.max(...ventas.map(v=>v.total||0)):0;
    semCajas = ventas.reduce((s,v)=>s+(v.cajas||0),0);
    totGastos=0; totSueldos=0; totOtros=0;
    utilidad = semTotal;
    porDia   = [{dia:"Semanas",total:semTotal}].filter(d=>d.total>0);
    porEst   = [];
  } else {
    // Modo completo: excluir Semanas de todo (es una seccion aparte)
    ventas = ventas.filter(v=>v.dia!=="Semanas");
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"a4"});
  const W = doc.internal.pageSize.getWidth();
  const M = 40;
  let y = 50;

  // Encabezado
  doc.setFillColor(13,15,20); doc.rect(0,0,W,80,"F");
  doc.setFillColor(201,168,76); doc.rect(0,78,W,2,"F");
  doc.setTextColor(201,168,76); doc.setFontSize(9);
  doc.text(soloSemanas?"REPORTE - SECCION SEMANAS":"REPORTE SEMANAL DE VENTAS", M, 32);
  doc.setTextColor(245,234,208); doc.setFontSize(22);
  doc.text(soloSemanas?"SEMANAS":"VENTAS", M, 58);
  doc.setTextColor(138,125,101); doc.setFontSize(10);
  doc.text("Semana "+getWeekNum()+" - "+getWeekRange(), M, 72);

  y = 110;
  doc.setTextColor(20,20,20);

  // KPIs
  doc.setFontSize(11); doc.setFont(undefined,"bold");
  doc.text("Resumen", M, y); y += 14;
  doc.setFont(undefined,"normal"); doc.setFontSize(10);
  const kpis = soloSemanas ? [
    ["Total Semanas", fmt(semTotal)],
    ["Promedio", fmt(semAvg)],
    ["Venta más alta", fmt(semMax)],
    ["Registros", String(ventas.length)],
    ["Total cajas", String(semCajas)],
  ] : [
    ["Total Semana", fmt(semTotal)],
    ["Promedio por cliente", fmt(semAvg)],
    ["Venta más alta", fmt(semMax)],
    ["Clientes", String(ventas.length)],
    ["Total cajas", String(semCajas)],
    ["Total gastos", fmt(totGastos)],
    ["Sueldos", fmt(totSueldos)],
    ["Otros gastos", fmt(totOtros)],
    ["Utilidad neta", fmt(utilidad)],
  ];
  doc.autoTable({
    startY: y, margin:{left:M,right:M},
    head:[["Concepto","Valor"]],
    body: kpis,
    theme:"grid",
    headStyles:{fillColor:[201,168,76],textColor:20,fontSize:9},
    bodyStyles:{fontSize:9},
    columnStyles:{1:{halign:"right"}}
  });
  y = doc.lastAutoTable.finalY + 20;

  // Ventas por día
  if(porDia.length){
    doc.setFont(undefined,"bold"); doc.setFontSize(11);
    doc.text("Ventas por día", M, y); y += 6;
    doc.autoTable({
      startY: y, margin:{left:M,right:M},
      head:[["Día","Total"]],
      body: porDia.map(d=>[d.dia,fmt(d.total)]),
      theme:"striped",
      headStyles:{fillColor:[201,168,76],textColor:20,fontSize:9},
      bodyStyles:{fontSize:9},
      columnStyles:{1:{halign:"right"}}
    });
    y = doc.lastAutoTable.finalY + 20;
  }

  // Ventas por lugar
  if(porEst.length){
    doc.setFont(undefined,"bold"); doc.setFontSize(11);
    doc.text("Ventas por lugar", M, y); y += 6;
    doc.autoTable({
      startY: y, margin:{left:M,right:M},
      head:[["Lugar","Total"]],
      body: porEst.map(e=>[e.lugar,fmt(e.total)]),
      theme:"striped",
      headStyles:{fillColor:[143,168,212],textColor:20,fontSize:9},
      bodyStyles:{fontSize:9},
      columnStyles:{1:{halign:"right"}}
    });
    y = doc.lastAutoTable.finalY + 20;
  }

  // Detalle de ventas — dividido por día
  if(ventas.length){
    doc.setFont(undefined,"bold"); doc.setFontSize(11);
    doc.text("Detalle de ventas por día", M, y); y += 10;
    const DIAS_ORDEN = soloSemanas ? ["Semanas"] : ["Lunes","Martes","Miercoles","Jueves","Viernes"];
    DIAS_ORDEN.forEach(dia=>{
      const vs = ventas.filter(v=>v.dia===dia);
      if(!vs.length) return;
      const totC = vs.reduce((s,v)=>s+(v.cajas||0),0);
      const totV = vs.reduce((s,v)=>s+(v.total||0),0);
      if(y > 720){ doc.addPage(); y = 50; }
      doc.setFont(undefined,"bold"); doc.setFontSize(10); doc.setTextColor(201,168,76);
      doc.text(dia+" ("+vs.length+")", M, y); y += 4;
      doc.setTextColor(20,20,20);
      doc.autoTable({
        startY: y, margin:{left:M,right:M},
        head:[["Cliente","Lugar","Cajas","Total"]],
        body: vs.map(v=>[v.cliente||"-",v.lugar||"-",String(v.cajas||0),fmt(v.total)]),
        foot:[["TOTAL "+dia.toUpperCase(),"",String(totC)+" cjs",fmt(totV)]],
        theme:"grid",
        headStyles:{fillColor:[201,168,76],textColor:20,fontSize:9},
        bodyStyles:{fontSize:8},
        footStyles:{fillColor:[30,32,40],textColor:[201,168,76],fontSize:10,fontStyle:"bold"},
        columnStyles:{2:{halign:"right"},3:{halign:"right"}}
      });
      y = doc.lastAutoTable.finalY + 14;
    });
    // Gran total
    if(y > 720){ doc.addPage(); y = 50; }
    const gTotC = ventas.reduce((s,v)=>s+(v.cajas||0),0);
    const gTotV = ventas.reduce((s,v)=>s+(v.total||0),0);
    doc.autoTable({
      startY: y, margin:{left:M,right:M},
      body:[["GRAN TOTAL SEMANA",String(gTotC)+" cjs",fmt(gTotV)]],
      theme:"grid",
      bodyStyles:{fillColor:[201,168,76],textColor:20,fontSize:11,fontStyle:"bold"},
      columnStyles:{1:{halign:"right"},2:{halign:"right"}}
    });
    y = doc.lastAutoTable.finalY + 20;
  }

  // Gastos
  if(gastos.length){
    if(y > 700){ doc.addPage(); y = 50; }
    doc.setFont(undefined,"bold"); doc.setFontSize(11);
    doc.text("Gastos ("+gastos.length+")", M, y); y += 6;
    const totG = gastos.reduce((s,g)=>s+(g.monto||0),0);
    doc.autoTable({
      startY: y, margin:{left:M,right:M},
      head:[["Concepto","Tipo","Monto"]],
      body: gastos.map(g=>[g.concepto||"-",g.tipo||"-",fmt(g.monto)]),
      foot:[["TOTAL","",fmt(totG)]],
      theme:"grid",
      headStyles:{fillColor:[212,119,90],textColor:255,fontSize:9},
      bodyStyles:{fontSize:9},
      footStyles:{fillColor:[30,32,40],textColor:[212,119,90],fontSize:10,fontStyle:"bold"},
      columnStyles:{2:{halign:"right"}}
    });
    y = doc.lastAutoTable.finalY + 20;
  }

  // Resultado final
  if(y > 720){ doc.addPage(); y = 50; }
  const okCol = soloSemanas ? [201,168,76] : (utilidad>=0 ? [126,184,160] : [212,119,90]);
  doc.setFillColor(okCol[0],okCol[1],okCol[2]);
  doc.rect(M, y, W-M*2, 60, "F");
  doc.setTextColor(255); doc.setFontSize(10);
  doc.text(soloSemanas?"TOTAL SEMANAS":"UTILIDAD NETA", M+16, y+22);
  doc.setFontSize(22); doc.setFont(undefined,"bold");
  doc.text(fmt(soloSemanas?semTotal:utilidad), W-M-16, y+42, {align:"right"});

  // Pie
  doc.setTextColor(120); doc.setFont(undefined,"normal"); doc.setFontSize(8);
  const total = doc.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    doc.text("Generado el "+new Date().toLocaleString("es-MX"), M, doc.internal.pageSize.getHeight()-20);
    doc.text("Página "+i+" de "+total, W-M, doc.internal.pageSize.getHeight()-20, {align:"right"});
  }

  const nombre = (soloSemanas?"reporte-semanas-":"reporte-ventas-semana-")+getWeekNum()+"-"+new Date().getFullYear()+".pdf";
  doc.save(nombre);
}

function getWeekRange(){
  const now=new Date(), mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=d=>d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
  return f(mon)+" - "+f(sun)+", "+now.getFullYear();
}
function getWeekNum(){
  const now=new Date(), s=new Date(now.getFullYear(),0,1);
  return Math.ceil(((now-s)/86400000+s.getDay()+1)/7);
}

function App(){
  const [ventas,   setVentas]   = useState([]);
  const [gastos,   setGastos]   = useState([]);
  const [semanas,  setSemanas]  = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [fbError,  setFbError]  = useState(null);
  const [tab,      setTab]      = useState("Todos");
  const [search,   setSearch]   = useState("");
  const [animIn,   setAnimIn]   = useState(false);

  // Venta form
  const [form,    setForm]    = useState({cliente:"",lugar:"",total:"",cajas:"",dia:"Lunes"});
  const [editId,  setEditId]  = useState(null);
  const [saved,   setSaved]   = useState(false);

  // Gasto form
  const [gForm,   setGForm]   = useState({concepto:"",monto:"",tipo:"Sueldo"});
  const [gEditId, setGEditId] = useState(null);
  const [gSaved,  setGSaved]  = useState(false);

  // UI
  const [showResumen,  setShowResumen]  = useState(false);
  const [showSemana,   setShowSemana]   = useState(null); // semana guardada seleccionada
  const [guardando,    setGuardando]    = useState(false);
  const [guardado,     setGuardado]     = useState(false);

  useEffect(()=>{
    setTimeout(()=>setAnimIn(true),80);
    const u1 = ventasRef.orderBy("creadoEn","asc").onSnapshot(
      s=>{setVentas(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      e=>{setFbError(e.message);setLoading(false);}
    );
    const u2 = gastosRef.orderBy("creadoEn","asc").onSnapshot(
      s=>setGastos(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}
    );
    const u3 = semanasRef.orderBy("guardadoEn","desc").onSnapshot(
      s=>setSemanas(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}
    );
    return()=>{u1();u2();u3();};
  },[]);

  // --- Calculos ---
  const isDia     = DIAS.includes(tab);
  // Semanas es una seccion separada: no cuenta en totales/graficas de la semana
  const ventasDias = ventas.filter(v=>v.dia!=="Semanas");
  const base = tab==="Semanas" ? ventas.filter(v=>v.dia==="Semanas")
             : isDia ? ventas.filter(v=>v.dia===tab)
             : ventasDias;
  const filtered  = base.filter(v=>(v.cliente||"").toLowerCase().includes(search.toLowerCase())||(v.lugar||"").toLowerCase().includes(search.toLowerCase()));

  // Totales de la semana (Lun-Vie, sin Semanas)
  const semTotal   = ventasDias.reduce((s,v)=>s+(v.total||0),0);
  const semAvg     = ventasDias.length?semTotal/ventasDias.length:0;
  const semMax     = ventasDias.length?Math.max(...ventasDias.map(v=>v.total||0)):0;
  const semCajas   = ventasDias.reduce((s,v)=>s+(v.cajas||0),0);
  const totGastos  = gastos.reduce((s,g)=>s+(g.monto||0),0);
  const totSueldos = gastos.filter(g=>g.tipo==="Sueldo").reduce((s,g)=>s+(g.monto||0),0);
  const totOtros   = gastos.filter(g=>g.tipo==="Gasto").reduce((s,g)=>s+(g.monto||0),0);
  const utilidad   = semTotal - totGastos;

  const filtTotal = filtered.reduce((s,v)=>s+(v.total||0),0);
  const filtCajas = filtered.reduce((s,v)=>s+(v.cajas||0),0);

  // Graficas: solo dias reales (excluir Semanas)
  const porDia = DIAS.filter(d=>d!=="Semanas").map(d=>({dia:d,total:ventasDias.filter(v=>v.dia===d).reduce((s,v)=>s+(v.total||0),0)})).filter(d=>d.total>0);
  const dMax   = porDia.length?Math.max(...porDia.map(d=>d.total)):1;
  const porEst = Object.values(ventasDias.reduce((a,v)=>{const k=v.lugar||"?";if(!a[k])a[k]={lugar:k,total:0};a[k].total+=v.total||0;return a;},{}));
  const eMax   = porEst.length?Math.max(...porEst.map(e=>e.total)):1;

  // --- CRUD ventas ---
  const handleSubmit = async()=>{
    if(!form.cliente||(!form.lugar&&form.dia!=="Semanas")||!form.total)return;
    const d={cliente:form.cliente.trim(),lugar:form.lugar.trim(),total:parseFloat(form.total)||0,cajas:parseInt(form.cajas)||0,dia:form.dia,
      creadoEn:editId?(ventas.find(v=>v.id===editId)||{}).creadoEn:firebase.firestore.FieldValue.serverTimestamp()};
    editId?await ventasRef.doc(editId).update(d):await ventasRef.add(d);
    setEditId(null);setForm({cliente:"",lugar:"",total:"",cajas:"",dia:"Lunes"});
    setSaved(true);setTimeout(()=>setSaved(false),1800);
  };
  const handleEdit = v=>{setEditId(v.id);setForm({cliente:v.cliente,lugar:v.lugar,total:String(v.total),cajas:String(v.cajas||""),dia:v.dia||"Lunes"});};
  const handleDelete = async id=>{if(window.confirm("Eliminar este registro?"))await ventasRef.doc(id).delete();};

  // --- CRUD gastos ---
  const handleGasto = async()=>{
    if(!gForm.concepto||!gForm.monto)return;
    const d={concepto:gForm.concepto.trim(),monto:parseFloat(gForm.monto)||0,tipo:gForm.tipo,
      creadoEn:gEditId?(gastos.find(g=>g.id===gEditId)||{}).creadoEn:firebase.firestore.FieldValue.serverTimestamp()};
    gEditId?await gastosRef.doc(gEditId).update(d):await gastosRef.add(d);
    setGEditId(null);setGForm({concepto:"",monto:"",tipo:"Sueldo"});
    setGSaved(true);setTimeout(()=>setGSaved(false),1800);
  };
  const handleGastoEdit = g=>{setGEditId(g.id);setGForm({concepto:g.concepto,monto:String(g.monto),tipo:g.tipo||"Sueldo"});};
  const handleGastoDelete = async id=>{if(window.confirm("Eliminar gasto?"))await gastosRef.doc(id).delete();};

  // --- Guardar / Borrar semana ---
  const handleGuardar = async()=>{
    setGuardando(true);
    await semanasRef.add({
      semana:getWeekNum(),rango:getWeekRange(),ano:new Date().getFullYear(),
      totalVentas:semTotal,totalGastos:totGastos,totalSueldos:totSueldos,totalOtros:totOtros,
      utilidadNeta:utilidad,totalCajas:semCajas,numClientes:ventas.length,
      ventas:ventas.map(v=>({cliente:v.cliente,lugar:v.lugar,total:v.total,cajas:v.cajas,dia:v.dia})),
      gastos:gastos.map(g=>({concepto:g.concepto,monto:g.monto,tipo:g.tipo})),
      guardadoEn:firebase.firestore.FieldValue.serverTimestamp()
    });
    setGuardando(false);setGuardado(true);setTimeout(()=>setGuardado(false),2500);
  };
  const handleDeleteSemana = async(id)=>{
    if(!window.confirm("Borrar esta semana guardada?"))return;
    await semanasRef.doc(id).delete();
  };

  const handleClearWeek = async()=>{
    if(!window.confirm("Borrar TODOS los registros de la semana?"))return;
    const s=await ventasRef.get(), b=db.batch();
    s.docs.forEach(d=>b.delete(d.ref));await b.commit();
  };

  // --- Loading / Error ---
  if(loading)return(
    <div style={{minHeight:"100vh",background:"#0d0f14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"16px"}}>
      <div style={{width:"32px",height:"32px",border:"3px solid rgba(201,168,76,.2)",borderTop:"3px solid #c9a84c",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
      <div style={{fontSize:"11px",letterSpacing:"4px",color:"#6a6358"}}>CONECTANDO...</div>
    </div>
  );
  if(fbError)return(
    <div style={{minHeight:"100vh",background:"#0d0f14",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{color:"#d4775a",fontSize:"12px",textAlign:"center",fontFamily:"monospace"}}>{fbError}</div>
    </div>
  );

  // ===================== RENDER =====================
  return(
  <div style={{minHeight:"100vh",background:"#0d0f14",fontFamily:"Courier New,monospace",color:"#e8e0d0"}}>

    {/* ── HEADER ── */}
    <div style={{background:"linear-gradient(135deg,#1a1f2e,#0d1117)",borderBottom:"2px solid #c9a84c",padding:"24px 24px 0",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(201,168,76,.05) 39px,rgba(201,168,76,.05) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(201,168,76,.05) 39px,rgba(201,168,76,.05) 40px)",pointerEvents:"none"}}/>
      <div style={{position:"relative",zIndex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
          <span style={{fontSize:"10px",letterSpacing:"5px",color:"#c9a84c",textTransform:"uppercase"}}>Reporte Semanal</span>
          <span style={{width:"7px",height:"7px",borderRadius:"50%",background:"#7eb8a0",boxShadow:"0 0 5px #7eb8a0",display:"inline-block"}}/>
        </div>
        <h1 style={{fontSize:"clamp(24px,5vw,46px)",fontWeight:"bold",color:"#f5ead0",letterSpacing:"-1px",lineHeight:1}}>VENTAS</h1>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginTop:"8px",flexWrap:"wrap"}}>
          <span style={{fontSize:"11px",color:"#8a7d65"}}>{getWeekRange()}</span>
          <button onClick={handleGuardar} disabled={guardando} style={{background:"rgba(126,184,160,.12)",color:"#7eb8a0",border:"1px solid rgba(126,184,160,.35)",padding:"4px 12px",borderRadius:"2px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer"}}>
            {guardando?"GUARDANDO...":guardado?"GUARDADO ✓":"GUARDAR SEMANA"}
          </button>
          <button onClick={handleClearWeek} style={{background:"rgba(212,119,90,.12)",color:"#d4775a",border:"1px solid rgba(212,119,90,.35)",padding:"4px 12px",borderRadius:"2px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer"}}>
            BORRAR SEMANA
          </button>
          <button onClick={()=>descargarPDF({ventas,gastos,semTotal,semAvg,semMax,semCajas,totGastos,totSueldos,totOtros,utilidad,porDia,porEst,modo:tab==="Semanas"?"semanas":"completo"})} style={{background:"rgba(143,168,212,.12)",color:"#8fa8d4",border:"1px solid rgba(143,168,212,.35)",padding:"4px 12px",borderRadius:"2px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer"}}>
            ⬇ DESCARGAR PDF
          </button>
        </div>
      </div>

      {/* TABS */}

                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"8px",letterSpacing:"2px",color:"#6a6358",textTransform:"uppercase"}}>Gastos</div>
                    <div style={{fontSize:"16px",color:"#d4775a",fontWeight:"bold"}}>{fmt(s.totalGastos)}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"8px",letterSpacing:"2px",color:"#6a6358",textTransform:"uppercase"}}>Cajas</div>
                    <div style={{fontSize:"16px",color:"#b07fd4",fontWeight:"bold"}}>{s.totalCajas||0} 📦</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"8px",letterSpacing:"2px",color:"#6a6358",textTransform:"uppercase"}}>Utilidad</div>
                    <div style={{fontSize:"16px",color:s.utilidadNeta>=0?"#7eb8a0":"#d4775a",fontWeight:"bold"}}>{fmt(s.utilidadNeta)}</div>
                  </div>
                  <button onClick={e=>{e.stopPropagation();handleDeleteSemana(s.id);}} style={{background:"rgba(212,119,90,.12)",color:"#d4775a",border:"1px solid rgba(212,119,90,.3)",padding:"4px 10px",borderRadius:"2px",fontFamily:"inherit",fontSize:"8px",letterSpacing:"2px",textTransform:"uppercase",cursor:"pointer"}}>BORRAR</button>
                  <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <button onClick={e=>{e.stopPropagation();if(window.confirm("Eliminar esta semana guardada?"))semanasRef.doc(s.id).delete();}} style={{background:"rgba(212,119,90,.12)",color:"#d4775a",border:"1px solid rgba(212,119,90,.3)",padding:"4px 10px",borderRadius:"2px",fontFamily:"inherit",fontSize:"8px",letterSpacing:"2px",textTransform:"uppercase",cursor:"pointer"}}>BORRAR</button>
                  <span style={{color:"#6a6358",fontSize:"16px"}}>{showSemana===s.id?"▲":"▼"}</span>
                </div>
                </div>
              </div>

              {/* Detalle expandido */}
              {showSemana===s.id&&(
                <div style={{borderTop:"1px solid rgba(255,255,255,.06)",padding:"16px 18px"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px"}}>
                    {/* Ventas */}
                    <div>
                      <div style={{fontSize:"8px",letterSpacing:"3px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"10px",paddingBottom:"6px",borderBottom:"1px solid rgba(201,168,76,.15)"}}>VENTAS ({(s.ventas||[]).length})</div>
                      {(s.ventas||[]).map((v,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
                          <span style={{fontSize:"11px",color:"#e8e0d0"}}>{v.cliente} <span style={{color:"#6a6358"}}>· {v.lugar}</span></span>
                          <span style={{fontSize:"11px",color:"#c9a84c"}}>{fmt(v.total)}</span>
                        </div>
                      ))}
                    </div>
                    {/* Gastos */}
                    <div>
                      <div style={{fontSize:"8px",letterSpacing:"3px",color:"#d4775a",textTransform:"uppercase",marginBottom:"10px",paddingBottom:"6px",borderBottom:"1px solid rgba(212,119,90,.15)"}}>GASTOS ({(s.gastos||[]).length})</div>
                      {(s.gastos||[]).length===0&&<div style={{fontSize:"10px",color:"#4a4540"}}>Sin gastos</div>}
                      {(s.gastos||[]).map((g,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
                          <span style={{fontSize:"11px",color:"#e8e0d0"}}>{g.concepto} <span style={{fontSize:"8px",color:"#d4775a",textTransform:"uppercase"}}>{g.tipo}</span></span>
                          <span style={{fontSize:"11px",color:"#d4775a"}}>{fmt(g.monto)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  {/* Resultado */}
                  <div style={{marginTop:"14px",padding:"12px",background:s.utilidadNeta>=0?"rgba(126,184,160,.07)":"rgba(212,119,90,.07)",borderRadius:"3px",border:"1px solid "+(s.utilidadNeta>=0?"rgba(126,184,160,.2)":"rgba(212,119,90,.2)"),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:"9px",letterSpacing:"3px",color:"#6a6358",textTransform:"uppercase"}}>Utilidad Neta</span>
                    <span style={{fontSize:"20px",fontWeight:"bold",color:s.utilidadNeta>=0?"#7eb8a0":"#d4775a"}}>{fmt(s.utilidadNeta)}</span>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </>)}

      <div style={{marginTop:"20px",fontSize:"8px",letterSpacing:"2px",color:"#2a2520",textAlign:"center"}}>SEMANA {getWeekNum()} &middot; {new Date().getFullYear()}</div>
    </div>

    {/* ══ MODAL RESUMEN FINAL ══ */}
    {showResumen&&(
      <div onClick={()=>setShowResumen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",backdropFilter:"blur(4px)"}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#141720",border:"1px solid rgba(201,168,76,.25)",borderRadius:"6px",width:"100%",maxWidth:"460px",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{background:"linear-gradient(135deg,#1a1f2e,#0d1117)",borderBottom:"1px solid rgba(201,168,76,.2)",padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:"8px",letterSpacing:"5px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"3px"}}>Resumen Final</div>
              <div style={{fontSize:"13px",color:"#f5ead0",fontWeight:"bold"}}>SEMANA {getWeekNum()} · {new Date().getFullYear()}</div>
              <div style={{fontSize:"10px",color:"#6a6358",marginTop:"2px"}}>{getWeekRange()}</div>
            </div>
            <button onClick={()=>setShowResumen(false)} style={{background:"none",border:"none",color:"#6a6358",cursor:"pointer",fontSize:"18px"}}>✕</button>
          </div>
          <div style={{padding:"20px"}}>
            {/* Ventas */}
            <div style={{marginBottom:"16px"}}>
              <div style={{fontSize:"8px",letterSpacing:"4px",color:"#c9a84c",textTransform:"uppercase",marginBottom:"10px",paddingBottom:"6px",borderBottom:"1px solid rgba(201,168,76,.15)"}}>VENTAS</div>
              {Object.values(ventas.reduce((a,v)=>{const k=v.lugar||"?";if(!a[k])a[k]={lugar:k,total:0,cajas:0,n:0};a[k].total+=v.total||0;a[k].cajas+=v.cajas||0;a[k].n++;return a;},{})).map((e,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 10px",background:"rgba(201,168,76,.04)",borderRadius:"3px",marginBottom:"4px"}}>
                  <span style={{fontSize:"11px",color:"#e8e0d0"}}>📍 {e.lugar}</span>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"13px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(e.total)}</div>
                    <div style={{fontSize:"8px",color:"#6a6358"}}>{e.cajas} cajas · {e.n} cliente{e.n!==1?"s":""}</div>
                  </div>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",marginTop:"4px"}}>
                <span style={{fontSize:"9px",letterSpacing:"2px",color:"#c9a84c",textTransform:"uppercase",fontWeight:"bold"}}>Total Ventas</span>
                <span style={{fontSize:"16px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(semTotal)}</span>
              </div>
            </div>
            {/* Gastos */}
            <div style={{marginBottom:"16px"}}>
              <div style={{fontSize:"8px",letterSpacing:"4px",color:"#d4775a",textTransform:"uppercase",marginBottom:"10px",paddingBottom:"6px",borderBottom:"1px solid rgba(212,119,90,.15)"}}>GASTOS</div>
              {gastos.length===0&&<div style={{fontSize:"10px",color:"#4a4540",padding:"10px 0"}}>Sin gastos registrados</div>}
              {gastos.map((g,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 10px",background:"rgba(212,119,90,.04)",borderRadius:"3px",marginBottom:"4px"}}>
                  <span style={{fontSize:"11px",color:"#e8e0d0"}}>{g.concepto} <span style={{fontSize:"8px",color:"#d4775a",textTransform:"uppercase"}}>{g.tipo}</span></span>
                  <span style={{fontSize:"13px",color:"#d4775a",fontWeight:"bold"}}>{fmt(g.monto)}</span>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",marginTop:"4px"}}>
                <span style={{fontSize:"9px",letterSpacing:"2px",color:"#d4775a",textTransform:"uppercase",fontWeight:"bold"}}>Total Gastos</span>
                <span style={{fontSize:"16px",color:"#d4775a",fontWeight:"bold"}}>{fmt(totGastos)}</span>
              </div>
            </div>
            {/* Resultado */}
            <div style={{background:utilidad>=0?"rgba(126,184,160,.08)":"rgba(212,119,90,.08)",border:"1px solid "+(utilidad>=0?"rgba(126,184,160,.3)":"rgba(212,119,90,.3)"),borderRadius:"4px",padding:"18px"}}>
              <div style={{fontSize:"8px",letterSpacing:"4px",color:utilidad>=0?"#7eb8a0":"#d4775a",textTransform:"uppercase",marginBottom:"14px",textAlign:"center"}}>RESULTADO FINAL</div>
              <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:"11px",color:"#8a7d65"}}>Total Ventas</span>
                  <span style={{fontSize:"13px",color:"#c9a84c",fontWeight:"bold"}}>{fmt(semTotal)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:"11px",color:"#8a7d65"}}>Total Gastos</span>
                  <span style={{fontSize:"13px",color:"#d4775a",fontWeight:"bold"}}>- {fmt(totGastos)}</span>
                </div>
                <div style={{height:"1px",background:utilidad>=0?"rgba(126,184,160,.3)":"rgba(212,119,90,.3)",margin:"4px 0"}}/>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                  <span style={{fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",color:utilidad>=0?"#7eb8a0":"#d4775a"}}>Utilidad Neta</span>
                  <span style={{fontSize:"24px",fontWeight:"bold",color:utilidad>=0?"#7eb8a0":"#d4775a"}}>{fmt(utilidad)}</span>
                </div>
              </div>
            </div>
            <button onClick={()=>descargarPDF({ventas,gastos,semTotal,semAvg,semMax,semCajas,totGastos,totSueldos,totOtros,utilidad,porDia,porEst,modo:tab==="Semanas"?"semanas":"completo"})} style={{width:"100%",marginTop:"16px",background:"rgba(143,168,212,.12)",border:"1px solid rgba(143,168,212,.35)",color:"#8fa8d4",padding:"11px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer",borderRadius:"3px",fontWeight:"bold"}}>⬇ DESCARGAR PDF</button>
            <button onClick={()=>setShowResumen(false)} style={{width:"100%",marginTop:"10px",background:"transparent",border:"1px solid rgba(255,255,255,.1)",color:"#6a6358",padding:"11px",fontFamily:"inherit",fontSize:"9px",letterSpacing:"3px",textTransform:"uppercase",cursor:"pointer",borderRadius:"3px"}}>CERRAR</button>
          </div>
        </div>
      </div>
    )}

  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
